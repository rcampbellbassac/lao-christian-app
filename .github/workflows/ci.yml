name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Run unit tests
        run: npm run test:unit -- --run

      - name: Build browser-test app
        run: npm run build-only

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser tests against production output
        run: npm run test:e2e:production

      - name: Verify GitHub Pages build
        env:
          VITE_BASE_PATH: /lao-christian-app/
        run: npm run build-only
