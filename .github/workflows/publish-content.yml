name: Publish Content to S3

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - src/assets/data/**
      - src/assets/data-normalized/**
      - scripts/normalize-content.mjs
      - scripts/build-content-release.mjs
      - scripts/publish-content.sh

permissions:
  id-token: write
  contents: read

concurrency:
  group: publish-content-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-west-2' }}
          role-duration-seconds: 1800
          role-session-name: lao-christian-${{ github.run_id }}
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Fetch source content from S3
        run: |
          set -euo pipefail
          mkdir -p src/assets/data

          prefix='${{ vars.CONTENT_S3_PREFIX }}'
          if [ -n "$prefix" ] && [ "${prefix: -1}" != "/" ]; then
            prefix="${prefix}/"
          fi

          for file in \
            LaoBible.json \
            LaoSongs.json \
            LaoBibleStudies.json \
            LaoEGW.json \
            LaoHealthBooks.json \
            LaoStories.json; do
            aws s3 cp "s3://${{ vars.CONTENT_S3_BUCKET }}/${prefix}${file}" "src/assets/data/${file}"
          done

      - name: Normalize data
        run: npm run normalize:data

      - name: Build content release
        run: npm run content:release
        env:
          CONTENT_BASE_URL: ${{ vars.CONTENT_BASE_URL }}
          CONTENT_RELEASE_VERSION: ${{ github.run_number }}
          CONTENT_PUBLISHED_AT: ${{ github.event.head_commit.timestamp || '' }}

      - name: Publish release to S3
        run: npm run content:publish
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
          S3_BUCKET: ${{ vars.CONTENT_S3_BUCKET }}
          S3_PREFIX: ${{ vars.CONTENT_S3_PREFIX }}
